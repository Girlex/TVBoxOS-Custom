name: Build Custom TVBox APK

# 编译「当前仓库」的代码（含内置源改动），不重新 clone 上游。
# 原 test.yml 会 clone q215613905/TVBoxOS 再构建，本地改动不会进入 APK。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建渠道：java 通用 / java32 仅32位 / java64 仅64位（python 系列需 Chaquo 运行时，本 workflow 未启用）'
        required: true
        default: 'java'
        type: choice
        options:
          - java
          - java32
          - java64
      build_type:
        description: 'debug 可直接安装；release 使用仓库自带 TVBoxOSC.jks 签名'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARIANT: ${{ inputs.variant || 'java' }}
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # AGP 7.2.2 要求 JDK 11；runner 默认是 JDK 17，不指定会失败。
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdkVersion 33，且 pyramid 声明 buildToolsVersion 30.0.3。
      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-33" "build-tools;33.0.0" "build-tools;33.0.2" "build-tools;30.0.3" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle memory and skip Chaquo Python module
        run: |
          sed -i -E 's/^#?(org.gradle.jvmargs=.*)/org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8/' gradle.properties
          # pyramid 模块里写死了 Windows 路径 D:/Programs/Python/Python38/python.exe，
          # 且 java 系列 flavor 并不依赖它，配置阶段移除可避免 Chaquo 插件干扰。
          sed -i "/include ':pyramid'/d" settings.gradle
          sed -i '/pythonImplementation project(":pyramid")/d; /python32Implementation project(":pyramid")/d; /python64Implementation project(":pyramid")/d' app/build.gradle
          echo "--- settings.gradle ---"
          cat settings.gradle

      - name: Inject release signing config
        if: ${{ (inputs.build_type || 'debug') == 'release' }}
        run: |
          python3 tools/ci_inject_signing.py
          echo "--- 注入后的签名片段 ---"
          sed -n '1,22p' app/build.gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          V="${VARIANT^}"
          T="${BUILD_TYPE^}"
          echo "Gradle task: assemble${V}${T}"
          ./gradlew "assemble${V}${T}" --no-daemon --stacktrace --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs -type f -name '*.apk' ! -name '*-unsigned.apk' -exec cp -v {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-${{ env.VARIANT }}-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
