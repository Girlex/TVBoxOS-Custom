name: Build Custom TVBox APK

# 编译「当前仓库」的代码（含内置源改动），不重新 clone 上游。
# 原 test.yml 会 clone q215613905/TVBoxOS 再构建，本地改动不会进入 APK。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建渠道：java 通用 / java32 仅32位 / java64 仅64位（python 系列需 Chaquo 运行时，本 workflow 未启用）'
        required: true
        default: 'java'
        type: choice
        options:
          - java
          - java32
          - java64
      build_type:
        description: 'debug 可直接安装；release 使用仓库自带 TVBoxOSC.jks 签名'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARIANT: ${{ inputs.variant || 'java' }}
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # AGP 7.2.2 要求 JDK 11；runner 默认是 JDK 17，不指定会失败。
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 不用 setup-android@v3：它会强制安装旧版 cmdline-tools(16.0)，
      # 与 ubuntu-latest 预装的 20.0 冲突，且 20.0 要求 JDK 17，
      # 在 AGP 7.2.2 需要的 JDK 11 下执行 --licenses 会直接失败。
      # 这里直接用镜像自带的 SDK，仅运行 sdkmanager 时临时切到 JDK 17。
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR" || { echo "sdkmanager 不存在"; ls -la "$SDK_ROOT/cmdline-tools"; exit 1; }
          JDK_FOR_SDKMGR="${JAVA_HOME_17_X64:-${JAVA_HOME_21_X64:-$JAVA_HOME}}"
          echo "sdkmanager 使用 JDK: $JDK_FOR_SDKMGR"
          export JAVA_HOME="$JDK_FOR_SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          # compileSdkVersion 33；AGP 7.2.2 默认 30.0.3，pyramid 也声明过 30.0.3，故一并安装。
          "$SDKMGR" --install "platforms;android-33" "build-tools;33.0.0" "build-tools;33.0.2" "build-tools;30.0.3" "platform-tools"
          echo "--- 已安装的 SDK 包 ---"
          "$SDKMGR" --list_installed 2>/dev/null | head -30 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle memory and skip Chaquo Python module
        run: |
          sed -i -E 's/^#?(org.gradle.jvmargs=.*)/org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8/' gradle.properties
          # pyramid 模块里写死了 Windows 路径 D:/Programs/Python/Python38/python.exe，
          # 且 java 系列 flavor 并不依赖它，配置阶段移除可避免 Chaquo 插件干扰。
          sed -i "/include ':pyramid'/d" settings.gradle
          sed -i '/pythonImplementation project(":pyramid")/d; /python32Implementation project(":pyramid")/d; /python64Implementation project(":pyramid")/d' app/build.gradle
          echo "--- settings.gradle ---"
          cat settings.gradle

      # versionCode 必须严格递增，否则与已安装版本冲突时无法覆盖安装。
      # 基线写在 version.properties；run_number 由 GitHub 保证每次运行单调递增。
      - name: Compute monotone version code
        run: |
          BASE="$(sed -n 's/^VERSION_CODE=//p' version.properties | tr -d '\r' | head -1)"
          case "$BASE" in ''|*[!0-9]*) BASE=1000 ;; esac
          CODE=$((BASE + GITHUB_RUN_NUMBER))
          echo "TVBOX_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "TVBOX_VERSION_NAME=1.0.$CODE" >> "$GITHUB_ENV"
          echo "本次构建: versionCode=$CODE, versionName=1.0.$CODE (基线 $BASE + run #$GITHUB_RUN_NUMBER)"

      # runner 每次都是全新机器，AGP 会自动生成一把随机的 debug.keystore，
      # 导致不同批次 APK 签名不同，覆盖安装报 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
      # 因此 debug 与 release 统一使用仓库自带的固定测试签名。
      - name: Pin signing key for every build
        run: |
          python3 tools/ci_inject_signing.py
          echo "--- 注入后的签名片段 ---"
          grep -n -A12 'signingConfigs' app/build.gradle | head -20

      - name: Build APK
        run: |
          chmod +x gradlew
          V="${VARIANT^}"
          T="${BUILD_TYPE^}"
          echo "Gradle task: assemble${V}${T}"
          ./gradlew "assemble${V}${T}" --no-daemon --stacktrace --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs -type f -name '*.apk' ! -name '*-unsigned.apk' -exec cp -v {} out/ \;
          printf 'versionCode=%s\nversionName=%s\ncommit=%s\nrun=%s\nsigning=TVBoxOSC.jks\n' \
            "$TVBOX_VERSION_CODE" "$TVBOX_VERSION_NAME" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > out/version.txt
          echo "--- 本次版本 ---"
          cat out/version.txt
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-${{ env.VARIANT }}-${{ env.BUILD_TYPE }}-v${{ env.TVBOX_VERSION_CODE }}-${{ github.sha }}
          path: |
            out/*.apk
            out/version.txt
          if-no-files-found: error
          retention-days: 30
