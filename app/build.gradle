apply plugin: 'com.android.application'

// ===== 版本号自动递增：避免每次构建产物版本相同，与已安装版本冲突 =====
// 云编译：由环境变量 TVBOX_VERSION_CODE 指定（version.properties 基线 + GITHUB_RUN_NUMBER），全局严格递增
// 本地构建：读取 version.properties 并 +1 写回；也可用 -PTVBOX_VERSION_CODE=1234 显式指定
// versionName 恒为 1.0.<versionCode>
def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def parseVersionCode = { Object raw, int fallback ->
    try {
        return raw == null ? fallback : raw.toString().trim().toInteger()
    } catch (Exception ignored) {
        return fallback
    }
}
int baseVersionCode = parseVersionCode(versionProps.getProperty('VERSION_CODE'), 1000)
def ciVersionCode = System.getenv('TVBOX_VERSION_CODE')
def cliVersionCode = project.hasProperty('TVBOX_VERSION_CODE') ? project.property('TVBOX_VERSION_CODE') : null
int appVersionCode
if (ciVersionCode != null && ciVersionCode.trim()) {
    appVersionCode = parseVersionCode(ciVersionCode, baseVersionCode)
} else if (cliVersionCode != null && cliVersionCode.toString().trim()) {
    appVersionCode = parseVersionCode(cliVersionCode, baseVersionCode)
} else {
    appVersionCode = baseVersionCode + 1
    versionPropsFile.text = "# 由 app/build.gradle 自动递增，请勿手工修改\n" +
            "# 本地构建: VERSION_CODE + 1；云编译: VERSION_CODE + GITHUB_RUN_NUMBER\n" +
            "# versionName 恒为 1.0.<versionCode>\n" +
            "VERSION_CODE=${appVersionCode}\n" +
            "VERSION_NAME=1.0.${appVersionCode}\n"
}
def appVersionName = "1.0.${appVersionCode}".toString()
println("[TVBox] versionCode=${appVersionCode}, versionName=${appVersionName}")

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId 'com.huzige.tv'
        targetSdkVersion 28
        versionCode appVersionCode
        versionName appVersionName
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/beans.xml'
    }

    flavorDimensions "mode"
    productFlavors {
        java {
            dimension "mode"
            minSdkVersion 19
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        java32 {
            dimension "mode"
            minSdkVersion 19
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters 'armeabi-v7a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        java64 {
            dimension "mode"
            minSdkVersion 21
            ndk {
                abiFilters 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        python {
            dimension "mode"
            minSdkVersion 19
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-python.pro'
        }
        python32 {
            dimension "mode"
            minSdkVersion 19
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters 'armeabi-v7a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-python.pro'
        }
        python64 {
            dimension "mode"
            minSdkVersion 21
            ndk {
                abiFilters 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-python.pro'
        }
    }

    sourceSets {
        java {
            java.srcDirs += 'src/normal/java'
        }
        java32 {
            java.srcDirs += 'src/normal/java'
        }
        java64 {
            java.srcDirs += 'src/normal/java'
        }
        python32 {
            java.srcDirs += 'src/python/java'
        }
        python64 {
            java.srcDirs += 'src/python/java'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
        }
    }

    // 禁用 ABI 分割
    splits {
        abi {
            enable false // 禁用 ABI 分割
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavorNames = variant.productFlavors.collect { it.name }.join('-')
            // 构建自定义文件名
            def fileName = "TVBox_${variant.buildType.name}-${flavorNames}.apk"
            outputFileName = fileName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
//    dexOptions {
//        javaMaxHeapSize "4g"
//        additionalParameters += '--multi-dex'
//        additionalParameters += '--set-max-idx-number=48000'
//        additionalParameters += '--minimal-main-dex'
//    }
}

